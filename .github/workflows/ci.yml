name: CI

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This library still ships PHPUnit 5/6, which cannot be installed on
        # PHP 8: the matrix covers the versions the suite can actually run on.
        php: ['7.2', '7.3', '7.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring, json
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      - run: npm install -g ganache-cli

      - run: composer install --no-interaction --prefer-dist

      - run: bash scripts/test.sh
